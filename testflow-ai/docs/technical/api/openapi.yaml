openapi: 3.0.3
info:
  title: TestFlow AI API
  version: '1.0'
  description: >
    Machine-readable contract for TestFlow's implemented API surface (Slice 1: Account
    Access & Subscription; QA Operating Model Setup; Projects — create and list). This file documents only endpoints
    that actually exist in backend/src/modules — it is generated/maintained alongside the
    code, not aspirational. Shared conventions (error envelope, pagination, tenant
    isolation) are defined in docs/technical/api-spec.md; per-module business rules are
    documented in docs/technical/api/*.md (qa-configuration.md for the QAOM endpoints
    below — note this slice implements only a subset of that document's full contract,
    see its own module doc and the QA Setup slice report for what's deferred). This file
    is the machine-readable contract; those documents remain the narrative source of
    truth — keep both in sync when an endpoint changes.

    Cross-cutting behaviour for every /v1 endpoint (not repeated per operation): every response carries
    `Cache-Control: no-store`; every state-changing request is subject to the Origin allow-list and may be refused with
    403 `forbidden_origin` (components/responses/ForbiddenOrigin; APID-022, TD-011); all responses carry baseline security headers
    (`X-Content-Type-Options: nosniff`, `Referrer-Policy: no-referrer`, `Content-Security-Policy: default-src 'none'; frame-ancestors 'none'`,
    `X-Frame-Options: DENY`, and `Strict-Transport-Security` in production).
servers:
  - url: /v1
    description: All product API paths are prefixed /v1 (APID-001). /health is unversioned infra.
tags:
  - name: auth
  - name: me
  - name: subscription
  - name: qa-configuration
  - name: projects
  - name: workspace
  - name: webhooks
  - name: health
paths:
  /auth/signup:
    post:
      tags: [auth]
      summary: Create an organisation and its first Admin/QA Manager user
      description: FR-AUTH-001/004/005/006, FR-ORG-001. No authentication required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name, role, organisationName]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                name: { type: string }
                role: { type: string, enum: [admin, qa_manager] }
                organisationName: { type: string }
      responses:
        '201':
          description: Account and organisation created; session cookie set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/login:
    post:
      tags: [auth]
      summary: Establish a session for an organisation member
      description: >
        FR-AUTH-002. NFR-SEC-001: locks out after 5 failed attempts within 15 minutes
        (429 rate_limited) regardless of whether the account exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Session established; session cookie set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post:
      tags: [auth]
      summary: Invalidate the current session
      description: FR-AUTH-003. Session destroyed server-side (NFR-SEC-002), not just the cookie cleared.
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Session invalidated; cookie cleared. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me:
    get:
      tags: [me]
      summary: Resolve the authenticated user, their organisation, and subscription access
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Current user/organisation/subscription context.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  organisation:
                    nullable: true
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      name: { type: string }
                  subscription: { $ref: '#/components/schemas/SubscriptionAccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /organisations/{orgId}/subscription:
    get:
      tags: [subscription]
      summary: Get the organisation's current subscription/trial access
      description: >
        FR-SUB-003. Admin/QA Manager only. Tenant isolation: orgId must match the
        caller's own organisation, else 404 (not 403) — never trusted from the path.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      responses:
        '200':
          description: Current subscription access.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionAccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /organisations/{orgId}/subscription/trial:
    post:
      tags: [subscription]
      summary: Activate the organisation's one-time trial
      description: FR-SUB-001. Admin/QA Manager only. Idempotent via Idempotency-Key header.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '201':
          description: Trial activated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscription:
                    type: object
                    properties:
                      planType: { type: string, example: trial }
                      trialEndsAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /organisations/{orgId}/subscription/monthly:
    post:
      tags: [subscription]
      summary: Initialize a Paystack transaction for a monthly subscription
      description: >
        FR-SUB-004. Admin/QA Manager only. Initializes payment only — no billing
        record is written until the Paystack webhook confirms the charge (NFR-REL-003).
        Amount is always computed server-side from seatCount, never trusted from the client.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seatCount]
              properties:
                seatCount: { type: integer, minimum: 1 }
      responses:
        '201': { $ref: '#/components/responses/PaystackTransaction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /organisations/{orgId}/subscription/yearly:
    post:
      tags: [subscription]
      summary: Initialize a Paystack transaction for a yearly subscription
      description: FR-SUB-005. Same contract as the monthly endpoint.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seatCount]
              properties:
                seatCount: { type: integer, minimum: 1 }
      responses:
        '201': { $ref: '#/components/responses/PaystackTransaction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /organisations/{orgId}/seats:
    post:
      tags: [subscription]
      summary: Initialize a Paystack transaction to add seats to an existing paid plan
      description: >
        FR-SUB-007/008. Requires an active paid (non-trial) subscription — 409 conflict
        if there is none, or if still on trial (must convert to paid first).
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seatCount]
              properties:
                seatCount: { type: integer, minimum: 1 }
      responses:
        '201': { $ref: '#/components/responses/PaystackTransaction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /organisations/{orgId}/billing-history:
    get:
      tags: [subscription]
      summary: List the organisation's billing/payment history
      description: FR-SUB-012. Admin/QA Manager only.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      responses:
        '200':
          description: Billing history.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /organisations/{orgId}/qa-configuration/presets:
    get:
      tags: [qa-configuration]
      summary: List the four approved starting QA process presets
      description: >
        FR-QAOM-003. Static, descriptive-only catalogue — never a runtime dependency
        for any published configuration (DBD-013).
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      responses:
        '200':
          description: The four presets.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/QaConfigurationPreset' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /organisations/{orgId}/qa-configuration/current:
    get:
      tags: [qa-configuration]
      summary: Get the organisation's current published QA Operating Model
      description: >
        FR-QAOM-009. Always exists once the organisation exists — Standard QA is
        auto-published at organisation creation (FR-QAOM-001). Readable by any
        organisation member.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      responses:
        '200':
          description: Current published configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QaConfigurationVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /organisations/{orgId}/qa-configuration/draft:
    post:
      tags: [qa-configuration]
      summary: Start a configuration draft from a preset (or an empty Custom draft)
      description: >
        FR-QAOM-002/004-008. Materializes the chosen preset's settings into the
        draft immediately (DBD-013) — the draft never "references" a live preset
        definition. `custom` starts from an empty draft (no child rows) — the full
        per-setting editor is a later QA Operating Model configuration screen, not
        built in this slice.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [presetOrigin]
              properties:
                presetOrigin: { type: string, enum: [standard, lightweight, controlled, custom] }
      responses:
        '201':
          description: Draft created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QaConfigurationVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: A configuration draft already exists for this organisation (one-draft-per-org).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [qa-configuration]
      summary: Retrieve the organisation's currently open draft
      description: FR-QAOM-008.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      responses:
        '200':
          description: The open draft.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QaConfigurationVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No draft is currently open — the client's signal to call POST .../draft instead.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /organisations/{orgId}/qa-configuration/draft/publish:
    post:
      tags: [qa-configuration]
      summary: Publish the organisation's open draft as its new current QA Operating Model
      description: >
        FR-QAOM-008/009. Runs bounded validation (this slice: a workflow shape must
        exist for every document type) and refuses to publish on failure —
        `422 validation_error` with a structured `errors[]` array
        (`{section, resource, code, message}`), same shape the draft would need to
        fix. On success, the previous published version remains intact and
        resolvable (FR-QAOM-012) — existing projects are never affected by a later
        publish (no `projects` table exists yet in this slice to demonstrate the
        pin itself).
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Newly published configuration.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QaConfigurationVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: No draft is currently open to publish.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '422':
          description: The draft is incomplete and cannot be published (CONFIGURATION_INVALID).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigurationValidationError' }
  /organisations/{orgId}/projects:
    get:
      tags: [projects]
      summary: List the projects visible to the caller
      description: >
        FR-PRJ-004. Admin and QA Manager see every project in their organisation; a
        QA Tester sees only projects they hold a membership on (the creator is granted
        one at creation). The rule is applied inside the SQL query — counts and filter
        options are computed over the same visible set, so they never leak hidden
        projects. Newest first; cursor-paginated (APID-002). Requires an active
        trial/subscription (FR-SUB-002): the only 403 returned here is
        `subscription_required`.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 120 }
          description: Case-insensitive match on project name or code. Longer than 120 characters is rejected with 422.
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [active, archived] }
        - name: qaConfigurationVersionId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
          description: Opaque `nextCursor` from the previous page.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: A page of visible projects.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [projects]
      summary: Create a project
      description: >
        FR-PRJ-001, FR-QAOM-012, PD-066, PD-067. Admin, QA Manager and QA Tester may
        create projects. The organisation and creator come from the session — never the
        body. The project is pinned, once, to the organisation's current published QA
        configuration version; `qaConfigurationVersionId` is optional and, if sent, must
        be that exact version (anything else — another organisation's, a draft, a
        superseded version, or an unknown id — returns the same 422). A per-organisation
        sequential `projectCode` (`PRJ-001`, ...) is assigned. The creator is granted a
        creator membership. Blocked with `subscription_required` (403) when the
        organisation has no active trial/subscription (FR-SUB-002) — that is the only 403
        returned here. 404 is returned when `orgId` is not the caller's organisation, and
        also if the organisation has no published QA configuration (a data-integrity
        fault that FR-QAOM-001 should make impossible).
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 120, description: Trimmed; required. }
                description: { type: string, nullable: true, maxLength: 500, description: Optional; blank is stored as null. }
                qaConfigurationVersionId: { type: string, format: uuid, description: Optional; defaults to the current published version. }
      responses:
        '201':
          description: Project created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /workspace:
    get:
      tags: [workspace]
      summary: Server-enforced proof that an active trial/subscription reaches normal application access
      description: >
        FR-SUB-002's concrete gate demonstration. Any real business endpoint added
        later should use the same requireActiveSubscription gate this route
        demonstrates.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Gate passed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  message: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Subscription/trial required (error `subscription_required`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /webhooks/payments:
    post:
      tags: [webhooks]
      summary: Paystack payment webhook — the sole place a paid subscription/seat batch is created
      description: >
        NOT authenticated via TestFlow's session — the one documented exception in
        api-spec.md. Authenticity comes only from the `x-paystack-signature` header,
        verified against the raw request body (AD-028). Idempotent: a redelivered
        event (Paystack retry, or an operator replay) is a no-op once its reference has
        been recorded in `processed_payment_events`; the marker and the payment writes
        commit in ONE transaction. Paystack retries every non-2xx answer, so everything
        that can never succeed on a retry is acknowledged with 200 and logged
        (`ignored: true`): event types TestFlow does not handle, signed events without a
        `reference`/`data`, charges without valid TestFlow metadata, unknown
        organisations. 500 is returned only for a genuine processing failure (nothing is
        committed then, so the retry is safe). TD-015.
      security: []
      parameters:
        - name: x-paystack-signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Event processed, a duplicate, or validly signed but not actionable (acknowledged, logged).
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean }
                  duplicate: { type: boolean, description: Already recorded by an earlier delivery; nothing changed. }
                  ignored: { type: boolean, description: Validly signed but not actionable (see the operation description); logged for reconciliation, never retried. }
        '400':
          description: Missing or invalid Paystack signature, or a body that is not a Paystack event object.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '500':
          description: Genuine processing failure (for example a database error). Nothing was committed; Paystack retries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /health:
    get:
      tags: [health]
      summary: Liveness/readiness check
      description: Deliberately unversioned infra endpoint, not a product API resource — not prefixed /v1.
      security: []
      responses:
        '200':
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: testflow_session
      description: >
        Session-based auth for organisation members (Admin/QA Manager/QA Tester).
        Established by POST /auth/login or /auth/signup; httpOnly, Secure in
        production, SameSite=None in production (cross-origin frontend/backend) /
        Lax in development.
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: >
        Always verified against the caller's own resolved organisation server-side
        (NFR-SEC-003) — a mismatch returns 404, not 403, indistinguishable from
        "doesn't exist".
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string }
      description: Replayed requests with the same key return the original stored response instead of re-executing.
  schemas:
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [admin, qa_manager, qa_tester] }
        organisationId: { type: string, format: uuid }
    SubscriptionAccess:
      type: object
      properties:
        planType:
          type: string
          nullable: true
          enum: [trial, monthly, yearly, null]
        status: { type: string }
        seatCount: { type: integer }
        trialEndsAt: { type: string, format: date-time, nullable: true }
    QaConfigurationPreset:
      type: object
      properties:
        presetOrigin: { type: string, enum: [standard, lightweight, controlled, custom] }
        name: { type: string }
        description: { type: string }
        recommended: { type: boolean }
    QaConfigurationSettingsSummary:
      type: object
      description: >
        Computed strictly from the version's own persisted child rows — never
        hardcoded per-preset copy. `templatesNote` is descriptive-only (module TPL
        doesn't exist yet in this slice).
      properties:
        templatesNote: { type: string }
        workflowShapes:
          type: object
          additionalProperties: { type: string, enum: [no_approval, single_approval, review_approval] }
          description: 'Keyed by document type: test_case, test_report, regression_report.'
        requiredArtifacts:
          type: array
          items: { type: string, enum: [requirements, test_cases, test_report, regression_report] }
        enabledGatesCount: { type: integer }
        totalGatesCount: { type: integer, example: 6 }
    QaConfigurationVersion:
      type: object
      properties:
        id: { type: string, format: uuid }
        organisationId: { type: string, format: uuid }
        versionNumber: { type: integer }
        status: { type: string, enum: [draft, published] }
        presetOrigin: { type: string, enum: [standard, lightweight, controlled, custom] }
        publishedBy: { type: string, format: uuid, nullable: true }
        publishedAt: { type: string, format: date-time, nullable: true }
        settings: { $ref: '#/components/schemas/QaConfigurationSettingsSummary' }
    ConfigurationValidationError:
      type: object
      description: The QA Operating Model's structured validation shape (extends the shared envelope with `errors[]`).
      properties:
        error: { type: string, example: validation_error }
        message: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              section: { type: string, example: workflows }
              resource: { type: string, example: test_case }
              code: { type: string, example: CONFIGURATION_INCOMPLETE }
              message: { type: string }
    ProjectQaConfiguration:
      type: object
      required: [versionId, versionNumber, presetOrigin]
      properties:
        versionId: { type: string, format: uuid }
        versionNumber: { type: integer }
        presetOrigin: { type: string, enum: [standard, lightweight, controlled, custom] }
    ProjectMember:
      type: object
      required: [userId, name]
      properties:
        userId: { type: string, format: uuid }
        name: { type: string }
    Project:
      type: object
      required: [id, organisationId, projectCode, name, description, status, createdAt, createdBy, qaConfiguration, members]
      properties:
        id: { type: string, format: uuid }
        organisationId: { type: string, format: uuid }
        projectCode: { type: string, example: PRJ-001, description: Per-organisation sequential code (PD-066); never reused. }
        name: { type: string }
        description: { type: string, nullable: true }
        status: { type: string, enum: [active, archived] }
        createdAt: { type: string, format: date-time }
        createdBy:
          type: object
          properties:
            userId: { type: string, format: uuid }
            name: { type: string }
        qaConfiguration: { $ref: '#/components/schemas/ProjectQaConfiguration' }
        members:
          type: array
          items: { $ref: '#/components/schemas/ProjectMember' }
    ProjectList:
      type: object
      required: [items, nextCursor, counts, qaConfigurations]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Project' }
        nextCursor: { type: string, nullable: true }
        counts:
          type: object
          description: Counts of the caller's visible projects, honouring `q` and the QA configuration filter but not `status`.
          properties:
            total: { type: integer }
            active: { type: integer }
            archived: { type: integer }
        qaConfigurations:
          type: array
          description: Distinct QA configuration versions among the caller's visible projects (list filter options).
          items: { $ref: '#/components/schemas/ProjectQaConfiguration' }
    ErrorEnvelope:
      type: object
      description: Shared error envelope (APID-007) used by every endpoint.
      properties:
        error: { type: string, description: 'Stable machine-readable error code, e.g. validation_error, unauthorized, forbidden, forbidden_origin, not_found, conflict, rate_limited, payment_required, subscription_required.' }
        message: { type: string }
        fields:
          type: object
          additionalProperties: { type: string }
          description: Present only for validation_error; per-field human-readable messages.
  responses:
    ValidationError:
      description: Request failed validation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: No valid session.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Authenticated, but role does not permit this action.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ForbiddenOrigin:
      description: >
        A state-changing request (any method except GET/HEAD/OPTIONS) to any /v1 path came from an origin that is not the
        trusted frontend, or from the literal origin "null", or carried `Sec-Fetch-Site: cross-site` / an untrusted `Referer`
        without an `Origin` header. Error code `forbidden_origin`. Requests with no `Origin`, `Referer` or cross-site marker
        (server-to-server clients, curl) are not affected. Returned before the route is resolved and before the body is parsed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found, or belongs to another organisation (tenant isolation, NFR-SEC-003).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: Request conflicts with current subscription state.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: Too many failed attempts; locked out temporarily (NFR-SEC-001).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    PaystackTransaction:
      description: Paystack transaction initialized (payment not yet confirmed — see the webhook).
      content:
        application/json:
          schema:
            type: object
            properties:
              reference: { type: string }
              accessCode: { type: string }
              amountCents: { type: integer, description: Server-computed; never trusts a client-submitted total. }
              planType: { type: string, enum: [monthly, yearly] }
              seatCount: { type: integer }
