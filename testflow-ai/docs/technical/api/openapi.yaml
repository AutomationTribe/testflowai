openapi: 3.0.3
info:
  title: TestFlow AI API
  version: '1.0'
  description: >
    Machine-readable contract for TestFlow's implemented API surface (Slice 1: Account
    Access & Subscription). This file documents only endpoints that actually exist in
    backend/src/modules — it is generated/maintained alongside the code, not aspirational.
    Shared conventions (error envelope, pagination, tenant isolation) are defined in
    docs/technical/api-spec.md; per-module business rules are documented in
    docs/technical/api/*.md. This file is the machine-readable contract; those documents
    remain the narrative source of truth — keep both in sync when an endpoint changes.
servers:
  - url: /v1
    description: All product API paths are prefixed /v1 (APID-001). /health is unversioned infra.
tags:
  - name: auth
  - name: me
  - name: subscription
  - name: workspace
  - name: webhooks
  - name: health
paths:
  /auth/signup:
    post:
      tags: [auth]
      summary: Create an organisation and its first Admin/QA Manager user
      description: FR-AUTH-001/004/005/006, FR-ORG-001. No authentication required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name, role, organisationName]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                name: { type: string }
                role: { type: string, enum: [admin, qa_manager] }
                organisationName: { type: string }
      responses:
        '201':
          description: Account and organisation created; session cookie set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/login:
    post:
      tags: [auth]
      summary: Establish a session for an organisation member
      description: >
        FR-AUTH-002. NFR-SEC-001: locks out after 5 failed attempts within 15 minutes
        (429 rate_limited) regardless of whether the account exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Session established; session cookie set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/logout:
    post:
      tags: [auth]
      summary: Invalidate the current session
      description: FR-AUTH-003. Session destroyed server-side (NFR-SEC-002), not just the cookie cleared.
      security: [{ sessionCookie: [] }]
      responses:
        '204': { description: Session invalidated; cookie cleared. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me:
    get:
      tags: [me]
      summary: Resolve the authenticated user, their organisation, and subscription access
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Current user/organisation/subscription context.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  organisation:
                    nullable: true
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      name: { type: string }
                  subscription: { $ref: '#/components/schemas/SubscriptionAccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /organisations/{orgId}/subscription:
    get:
      tags: [subscription]
      summary: Get the organisation's current subscription/trial access
      description: >
        FR-SUB-003. Admin/QA Manager only. Tenant isolation: orgId must match the
        caller's own organisation, else 404 (not 403) — never trusted from the path.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      responses:
        '200':
          description: Current subscription access.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubscriptionAccess' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /organisations/{orgId}/subscription/trial:
    post:
      tags: [subscription]
      summary: Activate the organisation's one-time trial
      description: FR-SUB-001. Admin/QA Manager only. Idempotent via Idempotency-Key header.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '201':
          description: Trial activated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscription:
                    type: object
                    properties:
                      planType: { type: string, example: trial }
                      trialEndsAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /organisations/{orgId}/subscription/monthly:
    post:
      tags: [subscription]
      summary: Initialize a Paystack transaction for a monthly subscription
      description: >
        FR-SUB-004. Admin/QA Manager only. Initializes payment only — no billing
        record is written until the Paystack webhook confirms the charge (NFR-REL-003).
        Amount is always computed server-side from seatCount, never trusted from the client.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seatCount]
              properties:
                seatCount: { type: integer, minimum: 1 }
      responses:
        '201': { $ref: '#/components/responses/PaystackTransaction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /organisations/{orgId}/subscription/yearly:
    post:
      tags: [subscription]
      summary: Initialize a Paystack transaction for a yearly subscription
      description: FR-SUB-005. Same contract as the monthly endpoint.
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seatCount]
              properties:
                seatCount: { type: integer, minimum: 1 }
      responses:
        '201': { $ref: '#/components/responses/PaystackTransaction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /organisations/{orgId}/seats:
    post:
      tags: [subscription]
      summary: Initialize a Paystack transaction to add seats to an existing paid plan
      description: >
        FR-SUB-007/008. Requires an active paid (non-trial) subscription — 409 conflict
        if there is none, or if still on trial (must convert to paid first).
      security: [{ sessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrgId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seatCount]
              properties:
                seatCount: { type: integer, minimum: 1 }
      responses:
        '201': { $ref: '#/components/responses/PaystackTransaction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /organisations/{orgId}/billing-history:
    get:
      tags: [subscription]
      summary: List the organisation's billing/payment history
      description: FR-SUB-012. Admin/QA Manager only.
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: '#/components/parameters/OrgId' }]
      responses:
        '200':
          description: Billing history.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { type: object }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /workspace:
    get:
      tags: [workspace]
      summary: Server-enforced proof that an active trial/subscription reaches the QA Setup boundary
      description: >
        Slice 1's concrete gate demonstration — QA Setup itself is implemented in a
        later slice. Any real business endpoint added later should use the same
        requireActiveSubscription gate this route demonstrates.
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Gate passed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  message: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Subscription/trial required (error `subscription_required`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /webhooks/payments:
    post:
      tags: [webhooks]
      summary: Paystack payment webhook — the sole place a paid subscription/seat batch is created
      description: >
        NOT authenticated via TestFlow's session — the one documented exception in
        api-spec.md. Authenticity comes only from the `x-paystack-signature` header,
        verified against the raw request body (AD-028). Idempotent: a redelivered
        event (Paystack retry, or an operator replay) is a no-op once its reference has
        been recorded in `processed_payment_events`.
      security: []
      parameters:
        - name: x-paystack-signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200':
          description: Event processed (or a duplicate, safely ignored).
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean }
                  duplicate: { type: boolean }
        '400':
          description: Missing or invalid Paystack signature.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  /health:
    get:
      tags: [health]
      summary: Liveness/readiness check
      description: Deliberately unversioned infra endpoint, not a product API resource — not prefixed /v1.
      security: []
      responses:
        '200':
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: testflow_session
      description: >
        Session-based auth for organisation members (Admin/QA Manager/QA Tester).
        Established by POST /auth/login or /auth/signup; httpOnly, Secure in
        production, SameSite=None in production (cross-origin frontend/backend) /
        Lax in development.
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: >
        Always verified against the caller's own resolved organisation server-side
        (NFR-SEC-003) — a mismatch returns 404, not 403, indistinguishable from
        "doesn't exist".
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string }
      description: Replayed requests with the same key return the original stored response instead of re-executing.
  schemas:
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [admin, qa_manager, qa_tester] }
        organisationId: { type: string, format: uuid }
    SubscriptionAccess:
      type: object
      properties:
        planType:
          type: string
          nullable: true
          enum: [trial, monthly, yearly, null]
        status: { type: string }
        seatCount: { type: integer }
        trialEndsAt: { type: string, format: date-time, nullable: true }
    ErrorEnvelope:
      type: object
      description: Shared error envelope (APID-007) used by every endpoint.
      properties:
        error: { type: string, description: 'Stable machine-readable error code, e.g. validation_error, unauthorized, forbidden, not_found, conflict, rate_limited, payment_required, subscription_required.' }
        message: { type: string }
        fields:
          type: object
          additionalProperties: { type: string }
          description: Present only for validation_error; per-field human-readable messages.
  responses:
    ValidationError:
      description: Request failed validation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: No valid session.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Forbidden:
      description: Authenticated, but role does not permit this action.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: Resource not found, or belongs to another organisation (tenant isolation, NFR-SEC-003).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: Request conflicts with current subscription state.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    RateLimited:
      description: Too many failed attempts; locked out temporarily (NFR-SEC-001).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    PaystackTransaction:
      description: Paystack transaction initialized (payment not yet confirmed — see the webhook).
      content:
        application/json:
          schema:
            type: object
            properties:
              reference: { type: string }
              accessCode: { type: string }
              amountCents: { type: integer, description: Server-computed; never trusts a client-submitted total. }
              planType: { type: string, enum: [monthly, yearly] }
              seatCount: { type: integer }
