## Render Blueprint for TestFlow (staging/beta — $0 hosting, no custom domain).
## Database is external (Neon PostgreSQL) — DATABASE_URL is set as a plain env
## var below (sync: false, i.e. set manually in the Render dashboard), not a
## Render-managed Postgres instance.
##
## The actual application (npm workspaces: backend/, frontend/, e2e/) lives in
## the `testflow-ai/` subdirectory of the GitHub repo, not at the repo root —
## the repo root only has an unrelated stray `package.json` (no workspaces).
## Each service below sets `rootDir: testflow-ai` so its buildCommand/
## startCommand run from the directory that actually has the real package.json
## with `"workspaces"` — without it, `npm install --workspaces` runs against
## the repo root's stray package.json and fails with "No workspaces found!".
##
## Both services' buildCommand runs `npm install` with NPM_CONFIG_PRODUCTION=false.
## This is required because NODE_ENV=production (set as an envVar below) makes
## npm skip devDependencies during install — but devDependencies here include
## typescript, @types/node, @types/express, @types/pg, @types/bcryptjs (backend
## tsc build) and typescript (frontend `next build`, needed to resolve the `@/*`
## tsconfig path alias). Without this override, both builds fail: the backend
## with dozens of `Cannot find name 'process'/'console'` TS errors, and the
## frontend with `Module not found: Can't resolve '@/components/...'` — this
## happened on a real deploy attempt. NPM_CONFIG_PRODUCTION=false only affects
## `npm install`'s dependency selection; NODE_ENV=production still applies at
## runtime (Express/Next.js production behavior), so this doesn't change what
## ships, only what's available at build time.
##
## After first deploy: set the backend service's CORS_ORIGIN to the frontend's
## real onrender.com URL, and the frontend service's NEXT_PUBLIC_API_BASE_URL to
## the backend's real onrender.com URL, then trigger a redeploy of each (this is
## a one-time chicken-and-egg step since neither URL exists until the other
## service has deployed once).

services:
  - type: web
    name: testflow-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: testflow-ai
    buildCommand: NPM_CONFIG_PRODUCTION=false npm install --workspaces --include-workspace-root && npm run build --workspace backend
    # Render's free tier does not support preDeployCommand (paid-tier-only
    # feature) — the safest free-tier-compatible equivalent is chaining the
    # migration into startCommand with `&&`, which runs on every boot (every
    # deploy, and every cold start after the free tier's idle-sleep). This is
    # safe because the migration runner (backend/src/db/migrate.ts) is
    # idempotent — it tracks applied migrations in schema_migrations and
    # re-running it is a no-op once a migration has already been applied.
    # `&&` also gives the required safety property for free: `migrate`
    # exits non-zero on failure (see migrate.ts's catch block), which
    # short-circuits the command — `start` never runs and Render marks the
    # deploy/boot as failed rather than serving traffic against an
    # unmigrated or partially-migrated database.
    startCommand: npm run migrate --workspace backend && npm run start --workspace backend
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # set manually — Neon connection string, never committed
      - key: CORS_ORIGIN
        sync: false # set manually once the frontend service's URL is known
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        sync: false
      - key: E2E_FAKE_PAYMENTS
        value: 'false' # must never be true in production — see backend/src/app.ts's double-gate

  - type: web
    name: testflow-frontend
    runtime: node
    plan: free
    region: oregon
    rootDir: testflow-ai
    buildCommand: NPM_CONFIG_PRODUCTION=false npm install --workspaces --include-workspace-root && npm run build --workspace frontend
    startCommand: npm run start --workspace frontend
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: '1'
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false # set manually once the backend service's URL is known — baked in at BUILD time
      - key: NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY
        sync: false
      - key: NEXT_PUBLIC_E2E_FAKE_PAYMENTS
        value: 'false'
