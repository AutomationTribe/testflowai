name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testflow
          POSTGRES_PASSWORD: testflow
          POSTGRES_DB: testflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The suite only runs against a local *_test database (backend/tests/testDatabaseGuard.ts).
      DATABASE_URL: postgres://testflow:testflow@localhost:5432/testflow_test
      TEST_DATABASE_URL: postgres://testflow:testflow@localhost:5432/testflow_test
      CORS_ORIGIN: http://localhost:3000
    defaults:
      run:
        working-directory: testflow-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: testflow-ai/package-lock.json
      - run: npm install --workspaces --include-workspace-root
      - run: npm run typecheck --workspace backend
      - run: npm run lint --workspace backend
      - run: npm run migrate --workspace backend
      - run: npm run test --workspace backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: testflow-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: testflow-ai/package-lock.json
      - run: npm install --workspaces --include-workspace-root
      - run: npm run typecheck --workspace frontend
      - run: npm run lint --workspace frontend
      - run: npm run test --workspace frontend

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testflow
          POSTGRES_PASSWORD: testflow
          POSTGRES_DB: testflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: testflow-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: testflow-ai/package-lock.json
      - run: npm install --workspaces --include-workspace-root
      - run: npm run typecheck --workspace e2e
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: testflow-ai/e2e
      - name: Run E2E critical journeys
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: testflow-ai/e2e/playwright-report/
          retention-days: 7

  security-audit:
    # Dependency vulnerability scan (docs/technical/security.md). Non-blocking by design —
    # continue-on-error surfaces findings in the run summary without breaking merges/deploys
    # on a transitive advisory the team hasn't triaged yet. The `security` agent performs the
    # broader pre-deployment review this doesn't cover (authZ, tenant isolation, etc.).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: testflow-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: testflow-ai/package-lock.json
      - run: npm install --workspaces --include-workspace-root
      - name: npm audit (backend)
        continue-on-error: true
        run: npm audit --workspace backend --audit-level=high
      - name: npm audit (frontend)
        continue-on-error: true
        run: npm audit --workspace frontend --audit-level=high
      - name: npm audit (e2e)
        continue-on-error: true
        run: npm audit --workspace e2e --audit-level=high
